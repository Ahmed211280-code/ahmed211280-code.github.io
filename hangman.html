<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>HANGMAN | Lemoo Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9454169755690880" crossorigin="anonymous"></script>
<style>
  :root{
    --sand-1:#F2D9AE;
    --sand-2:#D9A45E;
    --clay:#C4633F;
    --moss:#4A6B4A;
    --moss-dark:#334A34;
    --ink:#211A13;
    --cream:#FBF3E4;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; min-height:100%;
    background:var(--ink);
    font-family:'Rubik',sans-serif;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
  }
  #stage{
    position:relative; width:100vw; min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:20px 0;
  }
  #frame{
    position:relative;
    width:min(94vw, 480px);
    border-radius:22px;
    overflow:hidden;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.06);
    background:linear-gradient(180deg,#3a2f22,#241c15);
    padding-bottom:14px;
  }
  .hud{
    display:flex; justify-content:space-between; align-items:center;
    padding:16px 20px 4px;
    font-family:'Space Mono', monospace;
  }
  .hud .label{ font-size:10.5px; letter-spacing:1px; color:rgba(251,243,228,0.6); }
  .hud .value{ font-size:19px; font-weight:700; color:var(--cream); }

  .game-area{ padding:6px 20px 4px; text-align:center; }
  #gallows{ width:170px; height:150px; margin:0 auto; }

  .category{
    font-size:11.5px; color:rgba(251,243,228,0.55);
    font-family:'Space Mono', monospace; letter-spacing:1px;
    margin-bottom:6px;
  }
  .word-display{
    font-size:clamp(24px,7vw,34px);
    font-weight:800;
    color:var(--cream);
    letter-spacing:6px;
    margin:6px 0 16px;
    min-height:44px;
    word-break:break-word;
  }
  .word-display .blank{ color:var(--clay); }

  .keyboard{
    display:grid;
    grid-template-columns:repeat(7, 1fr);
    gap:6px;
    padding:0 16px;
    direction:rtl;
  }
  .key{
    background:linear-gradient(180deg, #E8C9A0, #D9A45E);
    border:none; border-radius:8px;
    font-family:'Rubik',sans-serif;
    font-weight:700; font-size:15px;
    color:#3a2a18;
    padding:9px 0;
    cursor:pointer;
  }
  .key:active{ transform:scale(0.92); }
  .key.correct{ background:linear-gradient(180deg,#8FCB94,#4A6B4A); color:#fff; }
  .key.wrong{ background:linear-gradient(180deg,#D98A76,#C4633F); color:#fff; opacity:0.7; }
  .key:disabled{ cursor:default; }

  #muteBtn{
    background:rgba(20,16,20,0.55); border:1px solid rgba(251,243,228,0.25);
    color:var(--cream); width:32px; height:32px; border-radius:50%;
    font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  #homeBtn{
    background:rgba(20,16,20,0.55); border:1px solid rgba(251,243,228,0.25);
    color:var(--cream); height:32px; padding:0 12px; border-radius:16px;
    font-family:'Rubik',sans-serif; font-size:11.5px; font-weight:600;
    text-decoration:none; display:flex; align-items:center; gap:4px;
  }
  .toprow{ display:flex; justify-content:space-between; padding:14px 16px 0; }

  #overlay{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px; text-align:center;
    background:radial-gradient(ellipse at center, rgba(15,12,20,0.55), rgba(10,8,14,0.9));
    backdrop-filter: blur(3px);
    transition:opacity 0.25s ease; padding:20px;
  }
  #overlay.hidden{ opacity:0; pointer-events:none; }
  .card{
    background:linear-gradient(180deg, rgba(24,18,26,0.94), rgba(14,10,16,0.97));
    border:1px solid rgba(251,243,228,0.14);
    border-radius:20px; padding:22px 26px 20px; max-width:340px; width:100%;
    box-shadow:0 25px 50px -15px rgba(0,0,0,0.6);
    display:flex; flex-direction:column; align-items:center; gap:11px;
  }
  .stat-row{
    display:flex; justify-content:space-between; width:100%;
    font-family:'Space Mono', monospace; font-size:11px;
    color:rgba(251,243,228,0.55); padding-bottom:10px;
    border-bottom:1px dashed rgba(251,243,228,0.15);
  }
  .stat-row b{ color:var(--sand-1); font-size:12px; }
  .card h1{
    margin:0; font-size:clamp(18px,4vw,22px); font-weight:800;
    color:var(--cream); text-shadow:0 3px 10px rgba(0,0,0,0.4); line-height:1.5;
  }
  .card p{
    margin:0; font-size:13px; color:rgba(251,243,228,0.8);
    max-width:280px; line-height:1.7;
  }
  #gameoverStats{ display:flex; gap:22px; }
  #gameoverStats div{ text-align:center; }
  #gameoverStats .n{ font-family:'Space Mono', monospace; font-size:18px; font-weight:700; color:var(--cream); }
  #gameoverStats .l{ font-size:10px; letter-spacing:1px; color:rgba(251,243,228,0.6); }
  #playBtn{
    margin-top:4px;
    background:linear-gradient(180deg, #6FCF7A, #3F9E52);
    color:#0E2410; border:none; padding:12px 30px; border-radius:999px;
    font-family:'Rubik',sans-serif; font-weight:700; font-size:14.5px;
    cursor:pointer; box-shadow:0 10px 26px -8px rgba(63,158,82,0.7);
    animation:pulseBtn 2.2s ease-in-out infinite;
  }
  #playBtn:active{ transform:scale(0.96); }
  @keyframes pulseBtn{
    0%,100%{ box-shadow:0 10px 26px -8px rgba(63,158,82,0.7), 0 0 0 0 rgba(111,207,122,0.45); }
    50%{ box-shadow:0 10px 26px -8px rgba(63,158,82,0.85), 0 0 0 10px rgba(111,207,122,0); }
  }
</style>
</head>
<body>
<div id="stage">
  <div id="frame">
    <div class="toprow">
      <button id="muteBtn" aria-label="كتم الصوت">🔊</button>
      <a id="homeBtn" href="index.html">🏠 الرئيسية</a>
    </div>
    <div class="hud">
      <div><div class="label">أفضل نتيجة</div><div class="value" id="bestVal">0</div></div>
      <div><div class="label">المحاولات المتبقية</div><div class="value" id="livesVal">6</div></div>
      <div><div class="label">النتيجة</div><div class="value" id="scoreVal">0</div></div>
    </div>

    <div class="game-area">
      <svg id="gallows" viewBox="0 0 170 150" xmlns="http://www.w3.org/2000/svg">
        <line x1="15" y1="140" x2="90" y2="140" stroke="#F2D9AE" stroke-width="5" stroke-linecap="round"/>
        <line x1="35" y1="140" x2="35" y2="14" stroke="#F2D9AE" stroke-width="5" stroke-linecap="round"/>
        <line x1="35" y1="14" x2="105" y2="14" stroke="#F2D9AE" stroke-width="5" stroke-linecap="round"/>
        <line x1="105" y1="14" x2="105" y2="34" stroke="#F2D9AE" stroke-width="4" stroke-linecap="round"/>
        <g id="parts">
          <circle id="p-head" cx="105" cy="48" r="14" fill="none" stroke="#E8836B" stroke-width="4"/>
          <line id="p-body" x1="105" y1="62" x2="105" y2="98" stroke="#E8836B" stroke-width="4" stroke-linecap="round"/>
          <line id="p-arm-l" x1="105" y1="72" x2="88" y2="90" stroke="#E8836B" stroke-width="4" stroke-linecap="round"/>
          <line id="p-arm-r" x1="105" y1="72" x2="122" y2="90" stroke="#E8836B" stroke-width="4" stroke-linecap="round"/>
          <line id="p-leg-l" x1="105" y1="98" x2="90" y2="122" stroke="#E8836B" stroke-width="4" stroke-linecap="round"/>
          <line id="p-leg-r" x1="105" y1="98" x2="120" y2="122" stroke="#E8836B" stroke-width="4" stroke-linecap="round"/>
        </g>
      </svg>
      <div class="category" id="categoryLabel">فئة: فواكه</div>
      <div class="word-display" id="wordDisplay">_ _ _ _</div>
      <div class="keyboard" id="keyboard"></div>
    </div>

    <div id="overlay">
      <div class="card">
        <div class="stat-row">
          <span>أفضل نتيجة: <b id="cardBest">0</b></span>
          <span>الفئات: <b>4</b></span>
        </div>
        <h1 id="overlayTitle">🔤 مرحباً بك في HANGMAN</h1>
        <p id="overlayText">خمّن الكلمة العربية حرف حرف قبل ما تخلص محاولاتك الست. كل كلمة صح بتدّيك نقاط، وكل غلطة بتقرّبك من الخسارة!</p>
        <div id="gameoverStats" style="display:none;">
          <div><div class="n" id="finalScore">0</div><div class="l">النتيجة</div></div>
          <div><div class="n" id="finalBest">0</div><div class="l">الأفضل</div></div>
        </div>
        <button id="playBtn">ابدأ اللعب 🚀</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayText = document.getElementById('overlayText');
  const playBtn = document.getElementById('playBtn');
  const scoreVal = document.getElementById('scoreVal');
  const bestVal = document.getElementById('bestVal');
  const livesVal = document.getElementById('livesVal');
  const cardBest = document.getElementById('cardBest');
  const gameoverStats = document.getElementById('gameoverStats');
  const finalScoreEl = document.getElementById('finalScore');
  const finalBestEl = document.getElementById('finalBest');
  const wordDisplay = document.getElementById('wordDisplay');
  const categoryLabel = document.getElementById('categoryLabel');
  const keyboardEl = document.getElementById('keyboard');

  const WORDS = {
    'فواكه': ['تفاحة','موز','برتقال','عنب','فراولة','بطيخ','أناناس','مانجو','كمثرى','خوخ','ليمون','رمان'],
    'حيوانات': ['أسد','نمر','فيل','زرافة','قرد','حصان','جمل','أرنب','ثعلب','ذئب','قطة','كلب'],
    'دول عربية': ['مصر','السعودية','الإمارات','المغرب','الجزائر','تونس','الأردن','لبنان','سوريا','العراق','قطر','الكويت'],
    'أدوات': ['كمبيوتر','هاتف','مفتاح','كرسي','طاولة','ساعة','نظارة','مظلة','حقيبة','مصباح','قلم','كتاب']
  };
  const ALPHABET = 'ابتثجحخدذرزسشصضطظعغفقكلمنهوي'.split('');

  let audioCtx = null, muted = false;
  function ensureAudio(){
    if(!audioCtx){ try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
    if(audioCtx && audioCtx.state==='suspended'){ audioCtx.resume(); }
  }
  function tone(freq, dur, opts){
    if(muted || !audioCtx) return;
    opts = opts||{};
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = opts.type||'sine';
    osc.frequency.setValueAtTime(freq, now);
    if(opts.slideTo!=null) osc.frequency.exponentialRampToValueAtTime(Math.max(1,opts.slideTo), now+dur);
    gain.gain.setValueAtTime(opts.gain!=null?opts.gain:0.16, now);
    gain.gain.exponentialRampToValueAtTime(0.0001, now+dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(now); osc.stop(now+dur+0.02);
  }
  const sfx = {
    correct(){ tone(560,0.1,{type:'square',slideTo:820,gain:0.14}); },
    wrong(){ tone(180,0.22,{type:'sawtooth',slideTo:70,gain:0.18}); },
    win(){ tone(520,0.12,{type:'triangle'}); setTimeout(()=>tone(700,0.14,{type:'triangle'}),110); setTimeout(()=>tone(900,0.2,{type:'triangle'}),220); },
    lose(){ tone(160,0.4,{type:'sawtooth',slideTo:40,gain:0.22}); },
    click(){ tone(300,0.07,{gain:0.1}); }
  };
  document.getElementById('muteBtn').addEventListener('click', function(){
    muted = !muted; this.textContent = muted?'🔇':'🔊';
  });

  let bestScore = 0;
  const STORAGE_KEY = 'hangman-best-score';
  async function loadBest(){
    try{
      if(window.storage){
        const r = await window.storage.get(STORAGE_KEY, false);
        if(r && r.value){ bestScore = parseInt(r.value,10)||0; }
      }
    }catch(e){}
    bestVal.textContent = bestScore; cardBest.textContent = bestScore;
  }
  async function saveBest(){
    try{ if(window.storage){ await window.storage.set(STORAGE_KEY, String(bestScore), false); } }catch(e){}
  }
  loadBest();

  let state = 'ready';
  let currentWord = '', currentCategory = '', guessed = [], wrongCount = 0, score = 0;
  const MAX_WRONG = 6;
  const partsOrder = ['p-head','p-body','p-arm-l','p-arm-r','p-leg-l','p-leg-r'];

  function pickWord(){
    const cats = Object.keys(WORDS);
    currentCategory = cats[Math.floor(Math.random()*cats.length)];
    const list = WORDS[currentCategory];
    currentWord = list[Math.floor(Math.random()*list.length)];
  }

  function renderGallows(){
    partsOrder.forEach((id,i)=>{
      document.getElementById(id).style.display = i < wrongCount ? 'block' : 'none';
    });
  }

  function renderWord(){
    wordDisplay.innerHTML = currentWord.split('').map(ch=>{
      if(guessed.includes(ch)) return `<span>${ch}</span>`;
      return `<span class="blank">_</span>`;
    }).join(' ');
  }

  function buildKeyboard(){
    keyboardEl.innerHTML = '';
    ALPHABET.forEach(letter=>{
      const btn = document.createElement('button');
      btn.className = 'key';
      btn.textContent = letter;
      btn.addEventListener('click', ()=> guessLetter(letter, btn));
      keyboardEl.appendChild(btn);
    });
  }

  function guessLetter(letter, btn){
    if(state !== 'playing' || guessed.includes(letter)) return;
    guessed.push(letter);
    if(currentWord.includes(letter)){
      btn.classList.add('correct');
      sfx.correct();
    } else {
      btn.classList.add('wrong');
      wrongCount++;
      livesVal.textContent = MAX_WRONG - wrongCount;
      sfx.wrong();
      renderGallows();
    }
    btn.disabled = true;
    renderWord();

    const allGuessed = currentWord.split('').every(ch => guessed.includes(ch));
    if(allGuessed){
      score += 10 + (MAX_WRONG - wrongCount) * 2;
      scoreVal.textContent = score;
      sfx.win();
      setTimeout(nextWord, 700);
    } else if(wrongCount >= MAX_WRONG){
      endGame();
    }
  }

  function nextWord(){
    pickWord();
    guessed = []; wrongCount = 0;
    livesVal.textContent = MAX_WRONG;
    categoryLabel.textContent = 'فئة: ' + currentCategory;
    renderGallows();
    renderWord();
    buildKeyboard();
  }

  function startGame(){
    state = 'playing';
    score = 0; scoreVal.textContent = '0';
    nextWord();
    overlay.classList.add('hidden');
    gameoverStats.style.display = 'none';
  }

  async function endGame(){
    state = 'over';
    sfx.lose();
    Array.from(keyboardEl.children).forEach(b=>b.disabled = true);
    if(score > bestScore){ bestScore = score; bestVal.textContent = bestScore; cardBest.textContent = bestScore; saveBest(); }
    finalScoreEl.textContent = score;
    finalBestEl.textContent = bestScore;
    overlayTitle.innerHTML = `اتشنقت! 💀 الكلمة كانت: <span style="color:#FF9B7A">${currentWord}</span>`;
    overlayText.style.display = 'none';
    gameoverStats.style.display = 'flex';
    playBtn.textContent = 'حاول تاني';
    overlay.classList.remove('hidden');
  }

  playBtn.addEventListener('click', ()=>{
    ensureAudio(); sfx.click();
    overlayTitle.textContent = '🔤 مرحباً بك في HANGMAN';
    overlayText.style.display = 'block';
    startGame();
  });

  // physical keyboard support (Arabic keys)
  window.addEventListener('keydown', (e)=>{
    if(state !== 'playing') return;
    const letter = e.key;
    if(ALPHABET.includes(letter)){
      const idx = ALPHABET.indexOf(letter);
      const btn = keyboardEl.children[idx];
      if(btn && !btn.disabled) guessLetter(letter, btn);
    }
  });

  buildKeyboard();
  renderGallows();
})();
</script>
</body>
</html>
